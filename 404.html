<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée | Bazié Josias</title>
    <meta name="description" content="Page non trouvée - Portfolio de Bazié Josias, Développeur Full-Stack.">
    <link rel="canonical" href="https://simplixp.vercel.app/404.html">
    <meta name="theme-color" content="#0b1120">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/svg+xml" href="./assets/images/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.min.css">

    <style>
        .page-404 {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            isolation: isolate;
        }

        .page-404::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image:
                radial-gradient(var(--color-border) 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.5;
        }

        .page-404::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(to bottom,
                transparent 0%,
                var(--color-background) 100%);
            pointer-events: none;
        }

        .glow-404 {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 1;
        }

        .glow-404--1 {
            width: 500px;
            height: 500px;
            background: var(--color-primary);
            opacity: 0.12;
            top: -200px;
            left: -150px;
            animation: orbit404 20s linear infinite;
        }

        .glow-404--2 {
            width: 400px;
            height: 400px;
            background: #c084fc;
            opacity: 0.1;
            bottom: -180px;
            right: -120px;
            animation: orbit404 25s linear infinite reverse;
        }

        .glow-404--3 {
            width: 300px;
            height: 300px;
            background: #60a5fa;
            opacity: 0.08;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse404 8s ease-in-out infinite;
        }

        @keyframes orbit404 {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(60px, -40px) rotate(90deg); }
            50% { transform: translate(0, -80px) rotate(180deg); }
            75% { transform: translate(-60px, -40px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        @keyframes pulse404 {
            0%, 100% { opacity: 0.08; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.15; transform: translate(-50%, -50%) scale(1.2); }
        }

        .card-404 {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 520px;
            padding: 64px 48px;
            background: var(--color-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            text-align: center;
        }

        .card-404 .border-beam::before {
            background: radial-gradient(circle at center, var(--color-primary) 0%, transparent 70%);
            width: 150px;
            height: 150px;
            filter: blur(8px);
        }

        body.dark-mode .card-404 .border-beam::before {
            background: radial-gradient(circle at center, #6366f1 0%, transparent 70%);
        }

        .code-404 {
            font-family: var(--font-heading);
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -8px;
            margin: 0 0 4px;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        .code-404-sub {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
            padding: 6px 16px;
            border-radius: var(--radius-full);
            background: var(--color-hover);
            border: 1px solid var(--color-border);
        }

        .code-404-sub .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-primary);
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .card-404 h2 {
            font-family: var(--font-heading);
            font-size: clamp(22px, 4vw, 28px);
            font-weight: 800;
            margin: 0 0 12px;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-404 p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
            line-height: 1.7;
            margin: 0 0 36px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .card-404 .primary-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            overflow: hidden;
        }

        .card-404 .primary-btn svg {
            transition: transform 0.3s ease;
        }

        .card-404 .primary-btn:hover svg {
            transform: translateX(4px);
        }

        .nav-404 {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-404 .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 18px;
            text-decoration: none;
            color: var(--color-text);
        }

        .nav-404 .logo img {
            width: 28px;
            height: 28px;
        }

        @media (max-width: 640px) {
            .card-404 {
                padding: 48px 24px;
                border-radius: var(--radius-md);
            }
            .card-404 .border-beam {
                display: none;
            }
        }
    </style>
</head>
<body style="overflow-x: hidden;">
    <div class="scroll-progress-container">
        <div class="scroll-progress-bar" id="scrollIndicator"></div>
    </div>

    <nav class="nav-404">
        <a href="./index.html" class="logo">
            <img src="./assets/images/logo.svg" alt="Simplix Logo">
            <span>Simplix</span>
        </a>
    </nav>

    <main class="page-404">
        <div class="glow-404 glow-404--1"></div>
        <div class="glow-404 glow-404--2"></div>
        <div class="glow-404 glow-404--3"></div>

        <div class="card-404" id="card404">
            <div class="border-beam"></div>

            <div class="code-404-sub">
                <span class="dot"></span>
                Error 404
            </div>

            <div class="code-404">404</div>

            <h2>Cette page s'est évaporée</h2>

            <p>
                On dirait que la page que vous cherchez a glissé dans une autre dimension. 
                Peut-être a-t-elle été déplacée, supprimée, ou n'a-t-elle jamais existé.
            </p>

            <a href="./index.html" class="primary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                Retour au portfolio
            </a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./js/main.js"></script>
    <script>
        if (document.getElementById('scrollIndicator')) {
            document.getElementById('scrollIndicator').style.display = 'none';
        }

        gsap.fromTo('.card-404', 
            { opacity: 0, y: 40, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.8, delay: 0.1, ease: 'expo.out' }
        );

        gsap.fromTo('.code-404',
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.6, delay: 0.3, ease: 'power3.out' }
        );

        gsap.fromTo('.card-404 h2',
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.5, delay: 0.5, ease: 'power3.out' }
        );

        gsap.fromTo('.card-404 p',
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.5, delay: 0.65, ease: 'power3.out' }
        );

        gsap.fromTo('.card-404 .primary-btn',
            { opacity: 0, y: 20 },
            { opacity: 1, y: 0, duration: 0.5, delay: 0.8, ease: 'power3.out' }
        );
    </script>
</body>
</html>
